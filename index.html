<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231f1b16'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23a8321f'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aftermath — what a retracted paper leaves behind</title>
    <meta
      name="description"
      content="A retracted paper keeps working: its citations keep spreading, and most of them never mention the retraction. Aftermath maps that on the real citation graph."
    />
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <div class="brand">
          <h1>Aftermath<span class="dot">.</span></h1>
          <p class="tagline">A retracted paper keeps working. This shows where.</p>
        </div>
        <nav class="seeds" id="seeds" aria-label="retractions"></nav>
      </header>

      <main class="stage">
        <section class="board" aria-label="citation cascade">
          <div class="claim" id="claim"></div>
          <div class="chart" id="chart"></div>
          <p class="legend" aria-hidden="true">
            <span class="lg"><i class="sw silent"></i>cites it, never cites the retraction</span>
            <span class="lg"><i class="sw aware"></i>cites the retraction</span>
            <span class="lg"><i class="sw before"></i>published before the retraction</span>
          </p>
        </section>

        <aside class="panel">
          <p class="story" id="story"></p>
          <section class="card" id="card"></section>

          <section class="rank">
            <h2>The loudest silence</h2>
            <p class="rank-note">Most-cited papers that build on it and never cite the retraction.</p>
            <ol id="rank"></ol>
          </section>

          <details class="query" id="query" hidden>
            <summary>the query behind that answer</summary>
            <pre><code id="cypher"></code></pre>
            <p class="query-meta" id="query-meta"></p>
          </details>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
